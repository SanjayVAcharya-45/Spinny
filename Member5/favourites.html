<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Favourite Cars - Spinny</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
        }

        /* Navbar */
        .navbar {
            background-color: #000;
            padding: 15px 30px;
        }

        .navbar-brand {
            color: white;
            font-size: 28px;
            font-weight: bold;
        }

        .navbar-brand span {
            color: #e63946;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }

        .back-btn:hover {
            color: #e63946;
        }

        /* Page heading */
        .page-header {
            background-color: white;
            padding: 25px 30px;
            border-bottom: 1px solid #ddd;
        }

        .page-header h2 {
            margin: 0;
            font-weight: bold;
        }

        .page-header p {
            margin: 5px 0 0;
            color: #777;
        }

        /* Car card */
        .car-card {
            background-color: white;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #ddd;
            transition: 0.3s;
            height: 100%;
        }

        .car-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }

        .car-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            background-color: #eee;
        }

        .car-details {
            padding: 18px;
        }

        .car-name {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .car-info {
            color: #666;
            font-size: 14px;
            margin-bottom: 12px;
        }

        .car-info span {
            margin-right: 12px;
        }

        .car-price {
            font-size: 20px;
            font-weight: bold;
            color: #111;
            margin-bottom: 15px;
        }

        .remove-btn {
            border: 1px solid #e63946;
            color: #e63946;
            background: white;
            width: 100%;
            padding: 9px;
            border-radius: 6px;
            font-weight: 600;
        }

        .remove-btn:hover {
            background-color: #e63946;
            color: white;
        }

        /* Empty state */
        .empty-box {
            background-color: white;
            border-radius: 12px;
            padding: 70px 20px;
            text-align: center;
            border: 1px solid #ddd;
        }

        .empty-box i {
            font-size: 65px;
            color: #e63946;
        }

        .empty-box h3 {
            margin-top: 20px;
            font-weight: bold;
        }

        .empty-box p {
            color: #777;
        }

        .browse-btn {
            background-color: #e63946;
            color: white;
            border: none;
            padding: 10px 25px;
            border-radius: 6px;
            text-decoration: none;
            display: inline-block;
            margin-top: 10px;
        }

        .browse-btn:hover {
            background-color: #c92f3b;
            color: white;
        }

        /* Favourite badge */
        .favourite-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .favourite-title i {
            color: #e63946;
        }

        .count-badge {
            background-color: #e63946;
            color: white;
            font-size: 13px;
            padding: 5px 10px;
            border-radius: 20px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="container-fluid">

            <a href="profile.html" class="navbar-brand">
                spin<span>ny</span>
            </a>

            <a href="profile.html" class="back-btn">
                <i class="bi bi-arrow-left"></i>
                Back to Profile
            </a>

        </div>
    </nav>


    <!-- Page Header -->
    <div class="page-header">
        <div class="container">

            <div class="favourite-title">
                <h2>
                    <i class="bi bi-heart-fill"></i>
                    Favourite Cars
                </h2>

                <span class="count-badge" id="favouriteCount">
                    0 Cars
                </span>
            </div>

            <p>Your liked cars are shown here.</p>

        </div>
    </div>


    <!-- Main Content -->
    <div class="container py-4">

        <!-- Favourite Cars -->
        <div class="row g-4" id="favouriteCarsContainer">
        </div>


        <!-- Empty Message -->
        <div id="emptyMessage" class="empty-box d-none">

            <i class="bi bi-heart"></i>

            <h3>No Favourite Cars</h3>

            <p>
                You haven't liked any cars yet.
            </p>

            <a href="profile.html" class="browse-btn">
                Back to Profile
            </a>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


    <script>

        /* Get liked cars from localStorage */
        function getFavourites() {

            return JSON.parse(
                localStorage.getItem("favouriteCars")
            ) || [];

        }


        /* Display only liked cars */
        function loadFavouriteCars() {

            const container =
                document.getElementById("favouriteCarsContainer");

            const emptyMessage =
                document.getElementById("emptyMessage");

            const count =
                document.getElementById("favouriteCount");

            const favourites = getFavourites();


            /* Update count */
            count.textContent =
                favourites.length +
                (favourites.length === 1 ? " Car" : " Cars");


            /* Clear previous cards */
            container.innerHTML = "";


            /* No favourite cars */
            if (favourites.length === 0) {

                emptyMessage.classList.remove("d-none");

                return;
            }


            /* Hide empty message */
            emptyMessage.classList.add("d-none");


            /* Display only liked cars */
            favourites.forEach(function (car, index) {

                const card = document.createElement("div");

                card.className = "col-lg-4 col-md-6";


                card.innerHTML = `

                    <div class="car-card">

                        <img
                            src="${car.image}"
                            class="car-image"
                            alt="${car.name}"
                            onerror="this.src='images/car-placeholder.jpg'"
                        >

                        <div class="car-details">

                            <div class="car-name">
                                ${car.name}
                            </div>

                            <div class="car-info">

                                <span>
                                    <i class="bi bi-calendar3"></i>
                                    ${car.year}
                                </span>

                                <span>
                                    <i class="bi bi-speedometer2"></i>
                                    ${car.km} km
                                </span>

                            </div>

                            <div class="car-info">

                                <span>
                                    <i class="bi bi-fuel-pump"></i>
                                    ${car.fuel}
                                </span>

                                <span>
                                    <i class="bi bi-gear"></i>
                                    ${car.transmission}
                                </span>

                            </div>

                            <div class="car-price">
                                ₹${car.price}
                            </div>

                            <button
                                class="remove-btn"
                                onclick="removeFavourite(${index})"
                            >
                                <i class="bi bi-heart-fill"></i>
                                Remove from Favourite
                            </button>

                        </div>

                    </div>

                `;


                container.appendChild(card);

            });

        }


        /* Remove a car from favourites */
        function removeFavourite(index) {

            let favourites = getFavourites();


            /* Remove selected car */
            favourites.splice(index, 1);


            /* Save updated list */
            localStorage.setItem(
                "favouriteCars",
                JSON.stringify(favourites)
            );


            /* Reload cards */
            loadFavouriteCars();

        }


        /* Load favourites when page opens */
        document.addEventListener(
            "DOMContentLoaded",
            loadFavouriteCars
        );

    </script>

</body>

</html>
