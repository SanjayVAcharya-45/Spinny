<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Favourite Cars - Spinny</title>


    <!-- Bootstrap CSS -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Bootstrap Icons -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet"
    >


    <style>

        body {

            background-color: #f5f5f5;

            font-family: Arial, sans-serif;

        }


        /* NAVBAR */

        .navbar {

            background-color: #000;

        }


        .navbar-brand {

            color: white !important;

            font-size: 24px;

            font-weight: bold;

        }


        .navbar-brand span {

            color: #e53935;

        }


        /* MAIN */

        .main-container {

            padding: 35px;

        }


        /* HEADER */

        .page-header {

            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 30px;

        }


        .page-title {

            font-size: 30px;

            font-weight: bold;

            margin: 0;

        }


        .page-title i {

            color: #0d6efd;

            margin-right: 10px;

        }


        /* COUNT */

        .count-badge {

            background-color: #e53935;

            color: white;

            padding: 6px 12px;

            border-radius: 20px;

            font-size: 14px;

            margin-left: 8px;

        }


        /* CLEAR BUTTON */

        .clear-btn {

            background-color: #000;

            color: white;

            border: none;

            padding: 10px 18px;

            border-radius: 7px;

        }


        .clear-btn:hover {

            background-color: #333;

        }


        /* CARD */

        .car-card {

            background-color: white;

            border-radius: 12px;

            overflow: hidden;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

            height: 100%;

            transition: 0.3s;

        }


        .car-card:hover {

            transform: translateY(-5px);

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.15);

        }


        /* IMAGE */

        .car-image {

            width: 100%;

            height: 210px;

            object-fit: cover;

            background-color: #eee;

        }


        /* DETAILS */

        .car-details {

            padding: 20px;

        }


        .car-name {

            font-size: 21px;

            font-weight: bold;

            margin-bottom: 12px;

        }


        .car-info {

            display: flex;

            justify-content: space-between;

            gap: 10px;

            margin-bottom: 9px;

            color: #666;

            font-size: 14px;

        }


        .car-info span {

            display: flex;

            align-items: center;

            gap: 5px;

        }


        .car-info i {

            color: #e53935;

        }


        .car-price {

            font-size: 20px;

            font-weight: bold;

            margin-top: 15px;

            margin-bottom: 15px;

            color: #111;

        }


        /* BUTTONS */

        .button-row {

            display: flex;

            gap: 10px;

        }


        .view-btn {

            flex: 1;

            background-color: #000;

            color: white;

            border: none;

            padding: 10px;

            border-radius: 7px;

        }


        .view-btn:hover {

            background-color: #333;

        }


        .remove-btn {

            flex: 1;

            background-color: #e53935;

            color: white;

            border: none;

            padding: 10px;

            border-radius: 7px;

        }


        .remove-btn:hover {

            background-color: #c62828;

        }


        /* EMPTY */

        .empty-message {

            background-color: white;

            padding: 60px 20px;

            border-radius: 12px;

            text-align: center;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.08);

        }


        .empty-message i {

            font-size: 65px;

            color: #e53935;

            margin-bottom: 20px;

        }


        .empty-message h3 {

            font-weight: bold;

        }


        .empty-message p {

            color: #777;

        }


        .browse-btn {

            background-color: #e53935;

            color: white;

            border: none;

            padding: 11px 22px;

            border-radius: 7px;

            text-decoration: none;

            display: inline-block;

            margin-top: 10px;

        }


        .browse-btn:hover {

            background-color: #c62828;

            color: white;

        }


        /* RESPONSIVE */

        @media (max-width: 768px) {

            .main-container {

                padding: 20px;

            }


            .page-header {

                flex-direction: column;

                align-items: flex-start;

                gap: 15px;

            }


            .car-info {

                flex-direction: column;

            }


            .button-row {

                flex-direction: column;

            }

        }

    </style>

</head>


<body>


<!-- NAVBAR -->

<nav class="navbar navbar-dark">

    <div class="container-fluid px-4">

        <a
            class="navbar-brand"
            href="profile.html"
        >

            <span>Spinny</span> | Favourite Cars

        </a>


        <a
            href="profile.html"
            class="btn btn-outline-light"
        >

            <i class="bi bi-person"></i>

            Profile

        </a>

    </div>

</nav>



<!-- MAIN -->

<div class="container-fluid main-container">


    <!-- HEADER -->

    <div class="page-header">

        <div>

            <h1 class="page-title">

                <i class="bi bi-heart-fill"></i>

                Favourite Cars

                <span
                    id="favouriteCount"
                    class="count-badge"
                >
                    0 Cars
                </span>

            </h1>

        </div>


        <button
            id="clearButton"
            class="clear-btn"
            onclick="clearAllFavourites()"
            style="display:none;"
        >

            <i class="bi bi-trash"></i>

            Clear All

        </button>

    </div>



    <!-- CAR CONTAINER -->

    <div
        id="favouriteCarsContainer"
        class="row g-4"
    >

    </div>



    <!-- EMPTY MESSAGE -->

    <div
        id="emptyMessage"
        class="empty-message d-none"
    >

        <i class="bi bi-heart"></i>

        <h3>
            No Favourite Cars
        </h3>

        <p>
            You haven't added any cars to your favourites yet.
        </p>

        <a
            href="../index.html"
            class="browse-btn"
        >

            <i class="bi bi-car-front"></i>

            Browse Cars

        </a>

    </div>

</div>



<!-- BOOTSTRAP JS -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>



<script>

    /*
       IMPORTANT:

       The car pages must save cars using this key:

       favouriteCars

    */

    const FAVOURITE_KEY =
        "favouriteCars";



    /* ----------------------------------
       GET FAVOURITES
    ---------------------------------- */

    function getFavourites() {

        try {

            const stored =
                localStorage.getItem(FAVOURITE_KEY);

            if (!stored) {

                return [];

            }


            const favourites =
                JSON.parse(stored);


            if (!Array.isArray(favourites)) {

                return [];

            }


            return favourites;

        }

        catch (error) {

            console.error(
                "Error reading favourite cars:",
                error
            );

            return [];

        }

    }



    /* ----------------------------------
       LOAD FAVOURITE CARS
    ---------------------------------- */

    function loadFavouriteCars() {

        const container =
            document.getElementById(
                "favouriteCarsContainer"
            );


        const emptyMessage =
            document.getElementById(
                "emptyMessage"
            );


        const count =
            document.getElementById(
                "favouriteCount"
            );


        const clearButton =
            document.getElementById(
                "clearButton"
            );


        const favourites =
            getFavourites();



        /* COUNT */

        count.textContent =
            favourites.length +
            (
                favourites.length === 1
                    ? " Car"
                    : " Cars"
            );



        /* CLEAR BUTTON */

        if (favourites.length > 0) {

            clearButton.style.display =
                "block";

        }

        else {

            clearButton.style.display =
                "none";

        }



        /* CLEAR OLD CARDS */

        container.innerHTML = "";



        /* EMPTY */

        if (favourites.length === 0) {

            emptyMessage.classList.remove(
                "d-none"
            );

            return;

        }



        /* HIDE EMPTY */

        emptyMessage.classList.add(
            "d-none"
        );



        /* DISPLAY CARS */

        favourites.forEach(
            function(car, index) {


                const cardColumn =
                    document.createElement("div");


                cardColumn.className =
                    "col-lg-4 col-md-6 col-sm-12";



                /*
                   Use a placeholder if image
                   is not available.
                */

                const image =
                    car.image ||
                    "images/car-placeholder.jpg";


                const name =
                    car.name ||
                    "Car";


                const year =
                    car.year ||
                    "N/A";


                const km =
                    car.km ||
                    "N/A";


                const fuel =
                    car.fuel ||
                    "N/A";


                const transmission =
                    car.transmission ||
                    "N/A";


                const price =
                    car.price ||
                    "Price not available";



                cardColumn.innerHTML = `

                    <div class="car-card">

                        <img
                            src="${image}"
                            class="car-image"
                            alt="${name}"
                            onerror="
                                this.onerror=null;
                                this.src='images/car-placeholder.jpg';
                            "
                        >


                        <div class="car-details">

                            <div class="car-name">
                                ${name}
                            </div>


                            <div class="car-info">

                                <span>
                                    <i class="bi bi-calendar3"></i>
                                    ${year}
                                </span>


                                <span>
                                    <i class="bi bi-speedometer2"></i>
                                    ${km} km
                                </span>

                            </div>


                            <div class="car-info">

                                <span>
                                    <i class="bi bi-fuel-pump"></i>
                                    ${fuel}
                                </span>


                                <span>
                                    <i class="bi bi-gear"></i>
                                    ${transmission}
                                </span>

                            </div>


                            <div class="car-price">
                                ₹${price}
                            </div>


                            <div class="button-row">

                                <button
                                    class="view-btn"
                                    onclick="viewCar(${index})"
                                >

                                    <i class="bi bi-eye"></i>

                                    View Details

                                </button>


                                <button
                                    class="remove-btn"
                                    onclick="removeFavourite(${index})"
                                >

                                    <i class="bi bi-heart-fill"></i>

                                    Remove

                                </button>

                            </div>

                        </div>

                    </div>

                `;


                container.appendChild(
                    cardColumn
                );

            }
        );

    }



    /* ----------------------------------
       VIEW CAR
    ---------------------------------- */

    function viewCar(index) {

        const favourites =
            getFavourites();


        const car =
            favourites[index];


        if (!car) {

            return;

        }


        /*
           If the car page URL was saved,
           open that page.
        */

        if (car.detailsPage) {

            window.location.href =
                car.detailsPage;

            return;

        }


        if (car.url) {

            window.location.href =
                car.url;

            return;

        }


        /*
           If no URL is available,
           show basic information.
        */

        alert(
            "Car: " + (car.name || "N/A") +
            "\nYear: " + (car.year || "N/A") +
            "\nKM: " + (car.km || "N/A") +
            "\nFuel: " + (car.fuel || "N/A") +
            "\nTransmission: " +
                (car.transmission || "N/A") +
            "\nPrice: ₹" +
                (car.price || "N/A")
        );

    }



    /* ----------------------------------
       REMOVE ONE FAVOURITE
    ---------------------------------- */

    function removeFavourite(index) {

        let favourites =
            getFavourites();


        if (
            index < 0 ||
            index >= favourites.length
        ) {

            return;

        }


        const carName =
            favourites[index].name ||
            "this car";


        const confirmRemove =
            confirm(
                "Remove " +
                carName +
                " from favourites?"
            );


        if (!confirmRemove) {

            return;

        }


        favourites.splice(
            index,
            1
        );


        localStorage.setItem(
            FAVOURITE_KEY,
            JSON.stringify(favourites)
        );


        loadFavouriteCars();

    }



    /* ----------------------------------
       CLEAR ALL
    ---------------------------------- */

    function clearAllFavourites() {

        const favourites =
            getFavourites();


        if (favourites.length === 0) {

            return;

        }


        const confirmClear =
            confirm(
                "Are you sure you want to remove all favourite cars?"
            );


        if (!confirmClear) {

            return;

        }


        localStorage.removeItem(
            FAVOURITE_KEY
        );


        loadFavouriteCars();

    }



    /* ----------------------------------
       PAGE LOAD
    ---------------------------------- */

    document.addEventListener(
        "DOMContentLoaded",
        function() {

            loadFavouriteCars();

        }
    );

</script>


</body>

</html>
