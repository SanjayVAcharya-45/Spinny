<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spinny - Login</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="bg-light">

<!-- Navbar -->
<nav class="navbar bg-white shadow-sm">
    <div class="container">

        <a class="navbar-brand fw-bold text-danger fs-3" href="#">
            <i class="bi bi-gem"></i> Spinny
        </a>

        <a href="#" class="text-dark text-decoration-none">
            Go to Home
            <i class="bi bi-house"></i>
        </a>

    </div>
</nav>


<!-- Login Section -->
<div class="container">

    <div class="row justify-content-center align-items-center"
         style="min-height: 85vh;">

        <div class="col-12 col-sm-10 col-md-7 col-lg-5">

            <!-- Login Card -->
            <div class="card border-0 shadow rounded-4">

                <div class="card-body p-4 p-md-5">

                    <!-- Heading -->
                    <div class="text-center mb-4">

                        <h3 class="fw-bold">
                            Welcome Back!
                        </h3>

                        <p class="text-muted">
                            Log in to your Spinny account
                        </p>

                    </div>

                    <!-- Message -->
                    <div id="loginMessage"></div>

                    <!-- Login Form -->
                    <form id="loginForm">

                        <!-- Email / Phone -->
                        <div class="mb-3">

                            <label for="emailOrPhone"
                                   class="form-label fw-semibold">

                                Email or Phone Number

                            </label>

                            <div class="input-group">

                                <span class="input-group-text bg-white">
                                    <i class="bi bi-person"></i>
                                </span>

                                <input
                                    type="text"
                                    id="emailOrPhone"
                                    class="form-control"
                                    placeholder="Enter email or phone number">

                            </div>

                        </div>


                        <!-- Password -->
                        <div class="mb-3">

                            <label for="password"
                                   class="form-label fw-semibold">

                                Password

                            </label>

                            <div class="input-group">

                                <span class="input-group-text bg-white">
                                    <i class="bi bi-lock"></i>
                                </span>

                                <input
                                    type="password"
                                    id="password"
                                    class="form-control"
                                    placeholder="Enter your password">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    id="showPassword">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>


                        <!-- Remember Me -->
                        <div class="d-flex justify-content-between align-items-center mb-3">

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="remember">

                                <label
                                    class="form-check-label"
                                    for="remember">

                                    Remember me

                                </label>

                            </div>

                            <a href="#"
                               class="text-danger text-decoration-none">

                                Forgot Password?

                            </a>

                        </div>


                        <!-- Login Button -->
                        <div class="d-grid">

                            <button
                                type="submit"
                                class="btn btn-danger py-2 fw-semibold">

                                Login

                            </button>

                        </div>


                        <!-- OR -->
                        <div class="text-center text-muted my-3">
                            or continue with
                        </div>


                        <!-- Social Buttons -->
                        <div class="row g-2">

                            <div class="col-6">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary w-100">

                                    <i class="bi bi-google"></i>
                                    Google

                                </button>

                            </div>

                            <div class="col-6">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary w-100">

                                    <i class="bi bi-facebook"></i>
                                    Facebook

                                </button>

                            </div>

                        </div>


                        <!-- Signup -->
                        <div class="text-center mt-4">

                            <span class="text-muted">
                                Don't have an account?
                            </span>

                            <a
                                href="signup.html"
                                class="text-danger fw-semibold text-decoration-none">

                                Sign Up

                            </a>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


<!-- Footer -->
<footer class="bg-white border-top py-3">

    <div class="container text-center text-muted">

        © 2026 Spinny. All Rights Reserved.

    </div>

</footer>


<!-- Bootstrap JavaScript -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<!-- Your JavaScript -->
<script src="auth.js"></script>

</body>
</html>
