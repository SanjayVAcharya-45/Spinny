<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Recently Viewed - Spinny</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">


    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
            font-family: Arial, sans-serif;
            color: #222;
        }


        /* ================= NAVBAR ================= */

        .navbar {
            background-color: #000;
            padding: 15px 30px;
        }

        .logo {
            color: white;
            text-decoration: none;
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #e63946;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .back-link:hover {
            color: #e63946;
        }


        /* ================= HEADER ================= */

        .page-header {
            background-color: white;
            padding: 25px 30px;
            border-bottom: 1px solid #ddd;
        }

        .header-container {
            max-width: 1250px;
            margin: auto;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .title-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .title-area i {
            color: #1479e8;
            font-size: 28px;
        }

        .title-area h2 {
            margin: 0;
            font-size: 26px;
            font-weight: bold;
        }

        .count-badge {
            background-color: #1479e8;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
        }

        .subtitle {
            color: #777;
            margin: 8px 0 0 40px;
            font-size: 14px;
        }

        .clear-btn {
            border: 1px solid #e63946;
            background-color: white;
            color: #e63946;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .clear-btn:hover {
            background-color: #e63946;
            color: white;
        }


        /* ================= MAIN ================= */

        .main-container {
            max-width: 1250px;
            margin: auto;
            padding: 30px 20px;
        }


        /* ================= CAR CARD ================= */

        .car-card {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            overflow: hidden;
            height: 100%;
            transition: 0.3s;
        }

        .car-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }


        /* ================= IMAGE ================= */

        .image-container {
            position: relative;
        }

        .car-image {
            width: 100%;
            height: 210px;
            object-fit: cover;
            display: block;
            background-color: #eee;
        }

        .recent-label {
            position: absolute;
            top: 12px;
            left: 12px;
            background-color: #1479e8;
            color: white;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 12px;
            font-weight: bold;
        }


        /* ================= CAR DETAILS ================= */

        .car-details {
            padding: 18px;
        }

        .car-name {
            font-size: 21px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .car-info {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 9px;
        }

        .info {
            background-color: #f5f5f5;
            color: #555;
            padding: 6px 9px;
            border-radius: 5px;
            font-size: 13px;
        }

        .info i {
            margin-right: 4px;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            margin: 15px 0;
        }


        /* ================= BUTTONS ================= */

        .button-group {
            display: flex;
            gap: 8px;
        }

        .view-btn {
            flex: 1;
            background-color: #e63946;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        .view-btn:hover {
            background-color: #c92f3b;
        }

        .remove-btn {
            width: 45px;
            background-color: white;
            color: #e63946;
            border: 1px solid #e63946;
            border-radius: 6px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background-color: #e63946;
            color: white;
        }


        /* ================= EMPTY MESSAGE ================= */

        .empty-box {
            background-color: white;
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 70px 20px;
            text-align: center;
        }

        .empty-icon {
            width: 80px;
            height: 80px;
            margin: auto;
            border-radius: 50%;
            background-color: #e5f1ff;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon i {
            color: #1479e8;
            font-size: 40px;
        }

        .empty-box h3 {
            margin-top: 20px;
            font-weight: bold;
        }

        .empty-box p {
            color: #777;
        }

        .profile-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 22px;
            background-color: #e63946;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        .profile-btn:hover {
            background-color: #c92f3b;
            color: white;
        }


        /* ================= RESPONSIVE ================= */

        @media (max-width: 768px) {

            .navbar {
                padding: 15px;
            }

            .header-row {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .subtitle {
                margin-left: 0;
            }

            .clear-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="container-fluid d-flex justify-content-between align-items-center">

            <a href="profile.html" class="logo">
                spin<span>ny</span>
            </a>

            <a href="profile.html" class="back-link">

                <i class="bi bi-arrow-left"></i>

                Back to Profile

            </a>

        </div>

    </nav>



    <!-- ================= PAGE HEADER ================= -->

    <div class="page-header">

        <div class="header-container">

            <div class="header-row">

                <div>

                    <div class="title-area">

                        <i class="bi bi-eye"></i>

                        <h2>
                            Recently Viewed
                        </h2>

                        <span
                            class="count-badge"
                            id="carCount">
                            0 Cars
                        </span>

                    </div>

                    <p class="subtitle">
                        Cars you have recently viewed
                    </p>

                </div>


                <button
                    class="clear-btn"
                    id="clearButton"
                    onclick="clearAllRecentlyViewed()">

                    <i class="bi bi-trash"></i>

                    Clear All

                </button>

            </div>

        </div>

    </div>



    <!-- ================= MAIN CONTENT ================= -->

    <div class="main-container">

        <!-- Cars will be inserted here -->

        <div
            class="row g-4"
            id="recentlyViewedContainer">
        </div>


        <!-- Empty state -->

        <div
            class="empty-box d-none"
            id="emptyMessage">

            <div class="empty-icon">

                <i class="bi bi-eye"></i>

            </div>

            <h3>
                No Recently Viewed Cars
            </h3>

            <p>
                Cars that you view will appear here.
            </p>

            <a
                href="profile.html"
                class="profile-btn">

                <i class="bi bi-arrow-left"></i>

                Back to Profile

            </a>

        </div>

    </div>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        /*
        =====================================================
        RECENTLY VIEWED CAR SYSTEM
        =====================================================

        STORAGE KEY:

        recentlyViewedCars

        OTHER TEAM MEMBERS CAN CONNECT THEIR CAR PAGE
        USING THE addToRecentlyViewed() FUNCTION.

        =====================================================
        */


        const STORAGE_KEY = "recentlyViewedCars";


        /* =====================================================
           GET RECENTLY VIEWED CARS
        ===================================================== */

        function getRecentlyViewedCars() {

            try {

                return JSON.parse(
                    localStorage.getItem(STORAGE_KEY)
                ) || [];

            } catch (error) {

                console.error(
                    "Unable to read recently viewed cars.",
                    error
                );

                return [];

            }

        }


        /* =====================================================
           SAVE RECENTLY VIEWED CARS
        ===================================================== */

        function saveRecentlyViewedCars(cars) {

            localStorage.setItem(
                STORAGE_KEY,
                JSON.stringify(cars)
            );

        }


        /* =====================================================
           ADD CAR TO RECENTLY VIEWED

           OTHER MEMBERS CAN USE THIS FUNCTION.

           Example:

           addToRecentlyViewed({
               id: 1,
               name: "Hyundai Creta",
               year: "2023",
               km: "25,000",
               fuel: "Petrol",
               transmission: "Automatic",
               price: "12.50 Lakh",
               image: "images/creta.jpg",
               detailsPage: "creta.html"
           });

        ===================================================== */

        function addToRecentlyViewed(car) {

            if (!car || !car.id) {

                console.error(
                    "Car must have a unique id."
                );

                return;

            }


            let recentlyViewed =
                getRecentlyViewedCars();


            /*
            Remove existing copy of the car.
            This prevents duplicate cars.
            */

            recentlyViewed =
                recentlyViewed.filter(function(item) {

                    return String(item.id) !== String(car.id);

                });


            /*
            Add the latest viewed car
            at the beginning.
            */

            recentlyViewed.unshift(car);


            /*
            Keep only the latest 10 cars.
            */

            recentlyViewed =
                recentlyViewed.slice(0, 10);


            saveRecentlyViewedCars(
                recentlyViewed
            );

        }


        /* =====================================================
           DISPLAY CARS
        ===================================================== */

        function displayRecentlyViewedCars() {

            const container =
                document.getElementById(
                    "recentlyViewedContainer"
                );

            const emptyMessage =
                document.getElementById(
                    "emptyMessage"
                );

            const count =
                document.getElementById(
                    "carCount"
                );

            const clearButton =
                document.getElementById(
                    "clearButton"
                );


            const cars =
                getRecentlyViewedCars();


            /* Update count */

            count.textContent =
                cars.length +
                (
                    cars.length === 1
                        ? " Car"
                        : " Cars"
                );


            /* Clear container */

            container.innerHTML = "";


            /* No cars */

            if (cars.length === 0) {

                emptyMessage.classList.remove(
                    "d-none"
                );

                clearButton.style.display =
                    "none";

                return;

            }


            /* Cars available */

            emptyMessage.classList.add(
                "d-none"
            );

            clearButton.style.display =
                "block";


            /* Create car cards */

            cars.forEach(function(car, index) {

                const card =
                    document.createElement("div");

                card.className =
                    "col-xl-4 col-lg-4 col-md-6";


                const image =
                    car.image ||
                    "images/car-placeholder.jpg";


                card.innerHTML = `

                    <div class="car-card">

                        <!-- Image -->

                        <div class="image-container">

                            <img
                                src="${image}"
                                alt="${car.name || "Car"}"
                                class="car-image"
                                onerror="
                                    this.src='images/car-placeholder.jpg'
                                "
                            >

                            <span class="recent-label">

                                <i class="bi bi-eye"></i>

                                Recently Viewed

                            </span>

                        </div>


                        <!-- Information -->

                        <div class="car-details">

                            <div class="car-name">
                                ${car.name || "Car"}
                            </div>


                            <div class="car-info">

                                <span class="info">

                                    <i class="bi bi-calendar3"></i>

                                    ${car.year || "N/A"}

                                </span>


                                <span class="info">

                                    <i class="bi bi-speedometer2"></i>

                                    ${car.km || "N/A"} km

                                </span>

                            </div>


                            <div class="car-info">

                                <span class="info">

                                    <i class="bi bi-fuel-pump"></i>

                                    ${car.fuel || "N/A"}

                                </span>


                                <span class="info">

                                    <i class="bi bi-gear"></i>

                                    ${car.transmission || "N/A"}

                                </span>

                            </div>


                            <div class="price">

                                ₹${car.price || "N/A"}

                            </div>


                            <div class="button-group">


                                <!-- View Details -->

                                <button
                                    class="view-btn"
                                    onclick="viewCarDetails(${index})">

                                    <i class="bi bi-eye"></i>

                                    View Details

                                </button>


                                <!-- Remove -->

                                <button
                                    class="remove-btn"
                                    onclick="removeRecentlyViewed(${index})"
                                    title="Remove">

                                    <i class="bi bi-trash"></i>

                                </button>

                            </div>

                        </div>

                    </div>

                `;


                container.appendChild(card);

            });

        }


        /* =====================================================
           VIEW DETAILS

           If the other member gives the car object:

           detailsPage: "creta.html"

           then this button automatically opens it.

        ===================================================== */

        function viewCarDetails(index) {

            const cars =
                getRecentlyViewedCars();


            const car =
                cars[index];


            if (!car) {

                return;

            }


            /* Open details page */

            if (car.detailsPage) {

                window.location.href =
                    car.detailsPage;

                return;

            }


            /* Support url also */

            if (car.url) {

                window.location.href =
                    car.url;

                return;

            }


            /*
            If no page was provided,
            show the available information.
            */

            alert(

                "Car: " +
                (car.name || "N/A") +

                "\nYear: " +
                (car.year || "N/A") +

                "\nKM: " +
                (car.km || "N/A") +

                "\nFuel: " +
                (car.fuel || "N/A") +

                "\nTransmission: " +
                (car.transmission || "N/A") +

                "\nPrice: ₹" +
                (car.price || "N/A")

            );

        }


        /* =====================================================
           REMOVE ONE CAR
        ===================================================== */

        function removeRecentlyViewed(index) {

            let cars =
                getRecentlyViewedCars();


            cars.splice(index, 1);


            saveRecentlyViewedCars(cars);


            displayRecentlyViewedCars();

        }


        /* =====================================================
           CLEAR ALL CARS
        ===================================================== */

        function clearAllRecentlyViewed() {

            const confirmClear =
                confirm(
                    "Are you sure you want to clear all recently viewed cars?"
                );


            if (!confirmClear) {

                return;

            }


            localStorage.removeItem(
                STORAGE_KEY
            );


            displayRecentlyViewedCars();

        }


        /* =====================================================
           PAGE LOAD
        ===================================================== */

        document.addEventListener(
            "DOMContentLoaded",
            function() {

                displayRecentlyViewedCars();

            }
        );

    </script>


    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
