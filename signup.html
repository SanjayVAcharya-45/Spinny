<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spinny - Sign Up</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>
        body {
            background-color: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .navbar-brand {
            font-size: 24px;
            font-weight: bold;
            color: #e51b23;
        }

        .signup-container {
            min-height: calc(100vh - 70px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .signup-card {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.10);
        }

        .signup-title {
            text-align: center;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .signup-subtitle {
            text-align: center;
            color: #777;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
        }

        .form-control {
            height: 45px;
            border-radius: 6px;
        }

        .form-control:focus {
            border-color: #e51b23;
            box-shadow: 0 0 0 0.2rem rgba(229, 27, 35, 0.15);
        }

        .input-group-text {
            background-color: #fff;
        }

        .signup-btn {
            width: 100%;
            background-color: #e51b23;
            border: none;
            color: white;
            height: 45px;
            font-weight: bold;
            border-radius: 6px;
        }

        .signup-btn:hover {
            background-color: #c9141b;
            color: white;
        }

        .login-link {
            color: #e51b23;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link:hover {
            text-decoration: underline;
        }

        .terms {
            font-size: 13px;
            color: #666;
        }

        .terms a {
            color: #e51b23;
            text-decoration: none;
        }

        .error-message {
            color: #dc3545;
            font-size: 13px;
            margin-top: 5px;
        }

        .success-message {
            color: #198754;
            font-size: 14px;
            text-align: center;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="#">
                <i class="bi bi-gem"></i> Spinny
            </a>

            <a href="login.html" class="btn btn-outline-danger btn-sm">
                <i class="bi bi-box-arrow-in-right"></i>
                Login
            </a>

        </div>
    </nav>


    <!-- Signup Section -->
    <div class="signup-container">

        <div class="signup-card">

            <h3 class="signup-title">Create Your Account</h3>

            <p class="signup-subtitle">
                Join Spinny and explore the best used cars
            </p>

            <div id="successMessage"></div>

            <form id="signupForm">

                <!-- Full Name -->
                <div class="mb-3">

                    <label for="fullName" class="form-label">
                        Full Name
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            class="form-control"
                            id="fullName"
                            placeholder="Enter your full name"
                        >

                    </div>

                    <div id="nameError" class="error-message"></div>

                </div>


                <!-- Email -->
                <div class="mb-3">

                    <label for="email" class="form-label">
                        Email
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-envelope"></i>
                        </span>

                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="Enter your email"
                        >

                    </div>

                    <div id="emailError" class="error-message"></div>

                </div>


                <!-- Phone -->
                <div class="mb-3">

                    <label for="phone" class="form-label">
                        Phone Number
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-telephone"></i>
                        </span>

                        <input
                            type="tel"
                            class="form-control"
                            id="phone"
                            placeholder="Enter your phone number"
                            maxlength="10"
                        >

                    </div>

                    <div id="phoneError" class="error-message"></div>

                </div>


                <!-- Password -->
                <div class="mb-3">

                    <label for="password" class="form-label">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Create a password"
                        >

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            id="togglePassword"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <div id="passwordError" class="error-message"></div>

                </div>


                <!-- Confirm Password -->
                <div class="mb-3">

                    <label for="confirmPassword" class="form-label">
                        Confirm Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock-fill"></i>
                        </span>

                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm your password"
                        >

                        <button
                            class="btn btn-outline-secondary"
                            type="button"
                            id="toggleConfirmPassword"
                        >
                            <i class="bi bi-eye"></i>
                        </button>

                    </div>

                    <div id="confirmPasswordError" class="error-message"></div>

                </div>


                <!-- Terms -->
                <div class="form-check mb-4">

                    <input
                        class="form-check-input"
                        type="checkbox"
                        id="terms"
                    >

                    <label class="form-check-label terms" for="terms">

                        I agree to the
                        <a href="#">Terms & Conditions</a>
                        and
                        <a href="#">Privacy Policy</a>

                    </label>

                    <div id="termsError" class="error-message"></div>

                </div>


                <!-- Create Account -->
                <button
                    type="submit"
                    class="btn signup-btn"
                >
                    Create Account
                </button>

            </form>


            <!-- Login -->
            <div class="text-center mt-4">

                <span class="text-muted">
                    Already have an account?
                </span>

                <a href="login.html" class="login-link">
                    Login
                </a>

            </div>

        </div>

    </div>


    <!-- Signup JavaScript -->
    <script src="auth.js"></script>

</body>
</html>
